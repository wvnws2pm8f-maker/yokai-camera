name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          # Cloudflare Workers側のURL(AI合成の入り口)。
          # リポジトリの Settings > Secrets and variables > Actions で
          # WORKER_URL という名前で登録すると、ここでビルドに埋め込まれる。
          # 未設定でもビルドは通り、その場合は「仮あわせ」モックで動作する。
          VITE_WORKER_URL: ${{ secrets.WORKER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
